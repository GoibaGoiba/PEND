<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="jogo.css">
    <title>Jogo da Velha - Drag & Drop</title>
</head>

<body>
    <h1>Jogo da Velha - Drag & Drop</h1>
    <div class="jogo">
        <div id="pecasX">
            <div class="pecaX" draggable="true" id="pecaX1">✖️</div>
            <div class="pecaX" draggable="true" id="pecaX2">✖️</div>
            <div class="pecaX" draggable="true" id="pecaX3">✖️</div>
            <div class="pecaX" draggable="true" id="pecaX4">✖️</div>
            <div class="pecaX" draggable="true" id="pecaX5">✖️</div>
            <div class="pecaX" draggable="true" id="pecaX6">✖️</div>
        </div>
        <div id="espacoJogo">
            <div class="espaco" id="espaco1"></div>
            <div class="espaco" id="espaco2"></div>
            <div class="espaco" id="espaco3"></div>
            <div class="espaco" id="espaco4"></div>
            <div class="espaco" id="espaco5"></div>
            <div class="espaco" id="espaco6"></div>
            <div class="espaco" id="espaco7"></div>
            <div class="espaco" id="espaco8"></div>
            <div class="espaco" id="espaco9"></div>
        </div>
        <div id="pecasO">
            <div class="pecaO" draggable="true" id="pecaO1">⭕</div>
            <div class="pecaO" draggable="true" id="pecaO2">⭕</div>
            <div class="pecaO" draggable="true" id="pecaO3">⭕</div>
            <div class="pecaO" draggable="true" id="pecaO4">⭕</div>
            <div class="pecaO" draggable="true" id="pecaO5">⭕</div>
            <div class="pecaO" draggable="true" id="pecaO6">⭕</div>
        </div>
    </div>
    <script src="jogo.js"></script>
</body>

</html>
