<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/person-plus-fill.svg" type="image/png">
</head>

<body>

    <header>
        <img src="img/TechConnect.png" alt="Logo da Empresa">
    </header>
    <!-- <h2>Cadastro de Usuário</h2> -->

    <form class="box">
        <input type="text" id="nome" placeholder="Escreva seu nome: ">
        <p id="nomeObrg" class="erro"></p>
        <br>
        <input type="text" id="email" placeholder="Escreva seu email: ">
        <p id="emailObrg" class="erro"></p>
        <br>
        <div class="input-group">
            <input type="password" id="senha" placeholder="Escreva sua senha: ">
            <i class="bi bi-eye-fill iconeOlho1" id="showSenha"></i>
            <p id="forcaSenha" class="erro"></p>
        </div>
        <br>
        <div id="checklist">
            <p id="preNum" class="req"> Pelo menos 8 caracteres</p>
            <p id="preComplex" class="req"> Pelo menos uma letra maiúscula e minúscula</p>
            <p id="preComplex" class="req"> Pelo menos um número</p>
            <p id="preComplex" class="req"> Pelo menos um caractere especial</p>
        </div>
        <br>
        <div class="input-group">
            <input type="password" id="confirmSenha" placeholder="Confirme sua senha: ">
            <i class="bi bi-eye-fill iconeOlho2" id="showConfirmSenha"></i>
        </div>
        <p id="senhaCorreta" class="erro"></p>
        <br>
        <div class="input-group">
            <input type="text" id="telefone" placeholder="Coloque um telefone Ex: (99) 99999-9999" maxlength="15">
            <i class="bi bi-plus-square icone" id="addTel"></i>
            <p id="telObrg" class="erro"></p>
        </div>
        <br>
        <div id="containerNovoTel"></div>
        <br>
        <p id="mensagem"></p>
        <br>
        <button type="button" id="cadastrar"  class="botao">Cadastrar</button>
    </form>

    <script src="script.js"></script>

</body>

</html>
