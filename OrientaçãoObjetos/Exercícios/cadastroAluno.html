<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
</head>

<body>
    <h1 id="titulo">Cadastro de Aluno</h1>
    <input id="nome" type="text" placeholder="Digite o nome do aluno">
    <input id="idade" type="number" placeholder="Digite a idade do aluno">
    <input id="curso" type="text" placeholder="Digite o curso do aluno">
    <input id="matricula" type="text" placeholder="Digite a matrícula do aluno">
    <button id="botaoCadastrar">
        Cadastrar
    </button>
    <div id="resultado"></div>
    <script src="cadastroAluno.js"></script>
</body>

</html>
