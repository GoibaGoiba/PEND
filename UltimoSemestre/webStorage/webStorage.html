<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro</title>
</head>
<body>
    <h1 id="titulo">Sistema de Cadastro</h1>
    <input id="nomeProduto" type="text" placeholder="Digite o nome do produto">
    <input id="precoProduto" type="number" placeholder="Digite o preço do produto">
    <input id="categoriaProduto" type="text" placeholder="Digite a categoria do produto">
    <input id="descontoProduto" type="number" placeholder="Digite o desconto do produto">
    <button id="botaoCadastrarProduto">
        Cadastrar Produto
    </button>
    <div id="resultadoProduto"></div>
    <script src="sistemaCadastros.js"></script>
</body>
</html>
