<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeekFinder!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>GeekFinder!</h1>
        <nav class="paginacao" aria-label="Paginação dos eventos">
            <button id="anterior" type="button">Anterior</button>
            <span id="pagina"></span>
            <button id="proximo" type="button">Próxima</button>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="cabecalho-eventos">
                <h2>Próximos eventos</h2>
                <p id="status" role="status">Carregando eventos...</p>
            </div>
            <div id="listaEventos" class="lista-eventos"></div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 GeekFinder. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
